# =============================================================================
# Energy Grid Platform - Key Vault backed RabbitMQ credentials
# =============================================================================
# Deployment-time template. The placeholders below are substituted by
# scripts/deploy.ps1 with Bicep outputs before the manifest is applied:
#
#   __ENERGY_WORKLOAD_IDENTITY_CLIENT_ID__ -> energyWorkloadIdentityClientId
#   __KEY_VAULT_NAME__                     -> keyVaultName
#   __AZURE_TENANT_ID__                    -> tenant of the deployment context
#
# The SecretProviderClass reads the RabbitMQ secrets created by
# scripts/configure-key-vault-secrets.ps1 and synchronizes them into the
# existing `rabbitmq-credentials` Kubernetes Secret, preserving the key names
# consumed by RabbitMQ, meter-service, dispatch-service and the breakable
# scenarios. No credential value is stored in Git.
#
# Apply manually (after deployment) with:
#   kubectl apply -f k8s/base/keyvault-secrets.yaml   # only after substitution
# =============================================================================

---
# Service account federated with the user-assigned managed identity created by
# infra/bicep/modules/energy-workload-identity.bicep. The federation subject is
# system:serviceaccount:energy:meter-service, so the name must not change
# without updating the Bicep parameter workloadIdentityServiceAccountName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meter-service
  namespace: energy
  labels:
    app: energy-grid
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "__ENERGY_WORKLOAD_IDENTITY_CLIENT_ID__"

---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rabbitmq-credentials
  namespace: energy
  labels:
    app: rabbitmq
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "__ENERGY_WORKLOAD_IDENTITY_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__AZURE_TENANT_ID__"
    objects: |
      array:
        - |
          objectName: rabbitmq-username
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: rabbitmq-amqp-uri
          objectType: secret
  secretObjects:
    - secretName: rabbitmq-credentials
      type: Opaque
      labels:
        app: rabbitmq
        sre-demo: breakable
      data:
        - objectName: rabbitmq-username
          key: rabbitmq-username
        - objectName: rabbitmq-password
          key: rabbitmq-password
        - objectName: rabbitmq-amqp-uri
          key: rabbitmq-amqp-uri
